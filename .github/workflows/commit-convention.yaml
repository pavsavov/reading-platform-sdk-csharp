name: Commit Convention

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Conventional commit validation (grace period)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Grace-period notice
        run: |
          echo "Conventional commit lint is currently warning-only."
          echo "Hard enforcement starts on 2026-05-17."
          echo "Required format: type: short description"
          echo "Scoped format: type(scope): short description"
          echo "Breaking format: type!: short description"

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs
          failOnWarnings: false
          failOnErrors: false
          helpURL: https://github.com/conventional-changelog/commitlint/#what-is-commitlint
